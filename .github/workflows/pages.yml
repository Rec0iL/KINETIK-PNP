# Baut die Web-App (tools/kinetik-vtt) und veröffentlicht sie auf GitHub Pages.
# Einmalig nötig: Repository-Einstellungen > Pages > Source: "GitHub Actions".
name: Web-App auf GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'tools/kinetik-vtt/**'
      - 'data/**'
      - 'scripts/check-data.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/kinetik-vtt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/kinetik-vtt/package-lock.json
      - run: npm ci
      - run: npm run check-data
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/kinetik-vtt/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
